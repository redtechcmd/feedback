<!DOCTYPE html>
<html lang="en">
<head>

<title>Holistic Feedback Generator</title>
<style>
  html, body { height: 100%; }
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; box-sizing: border-box; }
  body {

                 "Inter", "Helvetica Neue", Arial, sans-serif;

    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.9rem;
    color: #1d1d1f;
    letter-spacing: -0.01em;
    overflow: hidden;
  }
  .main-container {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 1rem;
    max-width: 1320px;
    width: 100%;
    height: 100%;
    max-height: 100%;
  }
  .panel {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 1.2rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 20px 40px -18px rgba(0,0,0,0.18);
    padding: 1rem 1.2rem;
    flex: 1;
    min-width: 300px;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .output-panel { display: flex; flex-direction: column; }
  h1, h2 {
    font-weight: 600;
    text-align: center;
    color: #1d1d1f;
    margin: 0 0 0.15rem;
    letter-spacing: -0.02em;
  }
  h1 { font-size: 1.1rem; }
  h2 { font-size: 1rem; margin-bottom: 0.5rem; }
  .subtitle { text-align: center; font-size: 0.68rem; color: #86868b; margin: 0 0 0.6rem; }
  form { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; min-height: 0; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }
  label { display: block; font-size: 0.62rem; font-weight: 590; color: #6e6e73; margin-bottom: 0.1rem; text-transform: uppercase; letter-spacing: 0.03em; }
  input[type="text"], select {
    width: 100%; padding: 0.35rem 0.5rem;

    outline: none; border-color: #0a84ff; box-shadow: 0 0 0 3px rgba(10,132,255,0.18);

  .slider-container { position: relative; margin: 0.1rem 0; }

  .slider-label .tag { font-size: 0.58rem; font-weight: 700; color: #0a84ff; background: rgba(10,132,255,0.1); padding: 0.02rem 0.35rem; border-radius: 0.35rem; white-space: nowrap; }
  .slider-value {

    -webkit-appearance: none; appearance: none; width: 100%; height: 3px;
    background: linear-gradient(90deg, #0a84ff 0%, #0a84ff var(--fill, 50%), rgba(118,118,128,0.18) var(--fill, 50%));
    border-radius: 3px; outline: none; transition: box-shadow 0.15s; margin: 0.2rem 0 0.05rem;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; background: #ffffff;
    border-radius: 50%; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.04);

  }
  input[type="range"]::-moz-range-track { height: 3px; border-radius: 3px; background: rgba(118,118,128,0.18); }
  input[type="range"]::-moz-range-progress { height: 3px; border-radius: 3px; background: #0a84ff; }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; background: #fff; border: none;
    border-radius: 50%; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.04);

  .btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }

  .btn-regenerate:hover { background: #9a3fc7; }
  .btn-copy { background: #30b855; color: white; }
  .btn-copy:hover { background: #279e48; }
  .output-text {

    padding: 0.85rem 0.95rem;

    border: 1px solid rgba(10,132,255,0.12);
    border-radius: 0.85rem;
    color: #1d1d1f;
    flex: 1;

  .output-text p:last-child { margin-bottom: 0; }
  .output-text strong { color: #0a5fc4; font-weight: 600; }
  .hidden { display: none; }
  .placeholder-hint { color: #a1a1a6; font-size: 0.75rem; text-align: center; margin-top: 0.6rem; }
  .word-count { text-align: right; font-size: 0.64rem; color: #a1a1a6; margin-top: 0.3rem; flex-shrink: 0; }

</style>
</head>
<body>

  <div class="main-container">
    <div class="panel">
      <h1>Holistic Feedback Generator</h1>

      <form id="feedbackForm">

          <div>

        </div>

        <div class="trait-grid">
          <div class="slider-container">
            <label class="slider-label"><span>Critical Thinking</span><span class="tag" id="slider1-tag"></span></label>
            <input type="range" min="1" max="10" value="6" id="slider1" />
            <span class="slider-value" id="slider1-value">6</span>
            <div class="tick-marks"><span>1</span><span>10</span></div>
          </div>
          <div class="slider-container">

          <div class="slider-container">
            <label class="slider-label"><span>Curiosity</span><span class="tag" id="slider3-tag"></span></label>
            <input type="range" min="1" max="10" value="6" id="slider3" />
            <span class="slider-value" id="slider3-value">6</span>
            <div class="tick-marks"><span>1</span><span>10</span></div>
          </div>
          <div class="slider-container">
            <label class="slider-label"><span>Independence</span><span class="tag" id="slider4-tag"></span></label>
            <input type="range" min="1" max="10" value="6" id="slider4" />
            <span class="slider-value" id="slider4-value">6</span>
            <div class="tick-marks"><span>1</span><span>10</span></div>
          </div>
          <div class="slider-container">
            <label class="slider-label"><span>Perseverance</span><span class="tag" id="slider5-tag"></span></label>
            <input type="range" min="1" max="10" value="6" id="slider5" />
            <span class="slider-value" id="slider5-value">6</span>
            <div class="tick-marks"><span>1</span><span>10</span></div>
          </div>
          <div class="slider-container">
            <label class="slider-label"><span>Resilience</span><span class="tag" id="slider6-tag"></span></label>
            <input type="range" min="1" max="10" value="6" id="slider6" />
            <span class="slider-value" id="slider6-value">6</span>
            <div class="tick-marks"><span>1</span><span>10</span></div>
          </div>
          <div class="slider-container">
            <label class="slider-label"><span>Respect</span><span class="tag" id="slider7-tag"></span></label>
            <input type="range" min="1" max="10" value="6" id="slider7" />
            <span class="slider-value" id="slider7-value">6</span>
            <div class="tick-marks"><span>1</span><span>10</span></div>
          </div>
          <div class="slider-container">
            <label class="slider-label"><span>Communication</span><span class="tag" id="slider8-tag"></span></label>
            <input type="range" min="1" max="10" value="6" id="slider8" />
            <span class="slider-value" id="slider8-value">6</span>
            <div class="tick-marks"><span>1</span><span>10</span></div>
          </div>
        </div>

        </div>
      </form>

      <p id="placeholderHint" class="placeholder-hint">Fill in the details and adjust the sliders to generate feedback.</p>
      <div id="wordCount" class="word-count hidden"></div>
      <div style="display:flex; gap:1rem; flex-wrap:wrap; margin-top:0.6rem;">
        <button id="regenerateBtn" class="btn-copy btn-regenerate hidden" style="flex:1;">Rephrase</button>
        <button id="copyBtn" class="btn-copy hidden" style="flex:1;">Copy Feedback</button>
      </div>
    </div>
  </div>

function getRandomElement(arr, exclude) {
  if (!arr || arr.length === 0) return "";
  const pool = exclude ? arr.filter(x => x !== exclude) : arr;
  const useArr = pool.length ? pool : arr;
  return useArr[Math.floor(Math.random() * useArr.length)];
}

function selectFragmentByScore(category, score) {
  const fragments = feedbackFragments.observations[category];
  if (score >= 9) return getRandomElement(fragments.excellent);
  if (score >= 7) return getRandomElement(fragments.strong);
  if (score >= 4) return getRandomElement(fragments.developing);
  return getRandomElement(fragments.needs_support);
}

function calculateAverageScore(scores) {
  const sum = Object.values(scores).reduce((a, c) => a + c, 0);
  return sum / Object.keys(scores).length;
}

function getOverallPerformanceLevel(avg) {
  if (avg >= 8) return "high";
  if (avg >= 5) return "medium";
  return "low";
}

function tierLabel(score) {
  if (score >= 9) return "Excellent";
  if (score >= 7) return "Strong";
  if (score >= 4) return "Developing";
  return "Needs Support";
}

// Converts **bold** markdown into <strong> and escapes any stray HTML first.
function mdBoldToHtml(text) {
  const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

const THEY_VERB_FIXES = {
  shows: "show", conveys: "convey", handles: "handle", manages: "manage",
  needs: "need", participates: "participate", struggles: "struggle",
  exceeds: "exceed", responds: "respond", leans: "lean", is: "are",
  articulates: "articulate", applies: "apply", maintains: "maintain",
  displays: "display", possesses: "possess", makes: "make",
  collaborates: "collaborate", keeps: "keep", shares: "share",
  tackles: "tackle", bounces: "bounce", holds: "hold", brings: "bring"
};

function fixTheyAgreement(text, pronounKey) {
  if (pronounKey !== "They") return text;
  let fixed = text;
  Object.entries(THEY_VERB_FIXES).forEach(([singular, plural]) => {
    const re = new RegExp(`\\b(They|they)\\s+${singular}\\b`, "g");
    fixed = fixed.replace(re, (m, subj) => `${subj} ${plural}`);
  });
  return fixed;
}

function fillPlaceholders(text, name, subject, p) {
  return text
    .replace(/\[Name\]/g, name)
    .replace(/\[Pronoun\]'s/g, p.possessiveCap)
    .replace(/\[Pronoun\]/g, p.subject)
    .replace(/\[pronoun's\]/g, p.possessive)
    .replace(/\[pronoun\]'s/g, p.possessive)
    .replace(/\[pronounSubj\]/g, p.subjectLower)
    .replace(/\[pronoun\]/g, p.object)
    .replace(/\[pronounself\]/g, p.reflexive)
    .replace(/\[Subject\]/g, subject);
}

const ALL_CONNECTORS = new Set([
  ...feedbackFragments.connectors.and,
  ...feedbackFragments.connectors.but
]);

function lowercaseFirst(text) {
  if (!text) return text;
  return text.charAt(0).toLowerCase() + text.slice(1);
}

function joinSentences(parts, protectedWord) {
  const clean = parts.filter(Boolean);
  const startsWithProtectedWord = (text) => protectedWord && text.startsWith(protectedWord);
  const adjusted = clean.map((part, i) => {
    const prev = clean[i - 1];
    if (prev && ALL_CONNECTORS.has(prev) && !startsWithProtectedWord(part)) return lowercaseFirst(part);
    return part;
  });
  return adjusted
    .join(" ")
    .replace(/\s+/g, " ")
    .replace(/\.\s*\./g, ".")
    .trim();
}

function buildRecommendationClause(cat, cat2) {
  const segue = getRandomElement(feedbackFragments.connectors.segue);
  const encouragement = getRandomElement(feedbackFragments.connectors.encouragement);
  const rec = getRandomElement(feedbackFragments.recommendations[cat]);
  let text = segue + encouragement + rec;
  if (cat2) {
    const rec2 = getRandomElement(feedbackFragments.recommendations[cat2]);
    text += " " + getRandomElement(feedbackFragments.connectors.and) + rec2;
  }
  return text;
}

function buildForwardLook(overallLevel) {
  return overallLevel === "high"
    ? getRandomElement(feedbackFragments.connectors.segue) + "we're excited to see [Name] continue pushing the boundaries of [pronoun]'s understanding in [Subject]."
    : getRandomElement(feedbackFragments.connectors.segue) + "we encourage [Name] to keep up [pronoun]'s dedication to [Subject] while working toward even greater mastery.";
}

const paragraphAVariants = [
  (ctx) => {
    const parts = [ctx.pickIntro()];
    parts.push(...ctx.strengths);
    if (ctx.strengths.length && ctx.improvements.length) parts.push(getRandomElement(feedbackFragments.connectors.but));
    parts.push(...ctx.improvements);
    return parts;
  },
  (ctx) => {
    const lead = ctx.strengths[0] || ctx.improvements[0];
    const rest = [...ctx.strengths.slice(ctx.strengths[0] ? 1 : 0), ...ctx.improvements.slice(ctx.improvements[0] === lead ? 1 : 0)];
    const parts = [lead, ctx.pickIntro()];
    if (rest.length && ctx.strengths.length && ctx.improvements.length) parts.push(getRandomElement(feedbackFragments.connectors.but));
    parts.push(...rest);
    return parts;
  },
  (ctx) => {
    if (!ctx.strengths.length || !ctx.improvements.length) return null;
    const parts = [ctx.strengths[0], getRandomElement(feedbackFragments.connectors.but), ctx.improvements[0]];
    if (ctx.strengths.length > 1) parts.push(getRandomElement(feedbackFragments.connectors.and), ctx.strengths[1]);
    return parts;
  },
  (ctx) => {
    if (!ctx.improvements.length) return null;
    const parts = [ctx.pickIntro(), ...ctx.improvements];
    if (ctx.strengths.length) parts.push(getRandomElement(feedbackFragments.connectors.but), ...ctx.strengths);
    return parts;
  }
];

const paragraphBVariants = [
  (ctx) => [ctx.recommendationText, ctx.conclusion],
  (ctx) => [ctx.conclusion, ctx.recommendationText],
  (ctx) => {
    if (!ctx.hasSpecificRec) return null;
    return [ctx.conclusion, ctx.recommendationText];
  }
];

function pickVariant(variants, ctx) {
  const viable = variants.map(fn => fn(ctx)).filter(Boolean);
  if (viable.length === 0) return null;
  return viable[Math.floor(Math.random() * viable.length)];
}

// -----------------------------------------------------------------------
// Generation. `length` controls how many paragraphs / points are covered;
// `tone` nudges word choice at the seams (kept lightweight and readable
// rather than a full separate phrase bank per tone).
// -----------------------------------------------------------------------
function generateFeedback(name, pronoun, subject, sliders, options) {
  const { length = "standard" } = options || {};
  const p = pronounForms[pronoun];
  const scores = {};
  categories.forEach((cat, i) => { scores[cat] = sliders[i]; });

  const averageScore = calculateAverageScore(scores);
  const overallLevel = getOverallPerformanceLevel(averageScore);

  const usedPhrases = new Set();
  const pick = (arr) => {
    let phrase = getRandomElement(arr);
    let attempts = 0;
    while (usedPhrases.has(phrase) && attempts < 6) {
      phrase = getRandomElement(arr);
      attempts++;
    }
    usedPhrases.add(phrase);
    return phrase;
  };

  const sortedByScore = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
  const lowestFirst = Object.keys(scores).sort((a, b) => scores[a] - scores[b]);

  const potentialStrengthCats = sortedByScore.filter(cat => scores[cat] >= 7);
  const potentialImprovementCats = lowestFirst.filter(cat => scores[cat] <= 6);

  // Length setting scales how many observation points get named per side.
  const pointCap = length === "concise" ? 1 : length === "detailed" ? 3 : 2;
  const strengthCount = Math.min(potentialStrengthCats.length, length === "concise" ? 1 : (Math.random() < 0.55 ? pointCap : pointCap - 1));
  const improvementCount = Math.min(potentialImprovementCats.length, length === "concise" ? 1 : (Math.random() < 0.55 ? pointCap : pointCap - 1));

  const strengths = potentialStrengthCats.slice(0, strengthCount).map(cat => selectFragmentByScore(cat, scores[cat]));
  const improvements = potentialImprovementCats.slice(0, improvementCount).map(cat => selectFragmentByScore(cat, scores[cat]));

  const genericPositive = "Overall, [Name] consistently approaches [Subject] with a positive attitude.";
  const genericConstructive = "A consistent application of effort across all areas of [Subject] will support [Name]'s overall growth.";
  if (!strengths.length && !improvements.length) {
    (averageScore >= 5.5 ? strengths : improvements).push(averageScore >= 5.5 ? genericPositive : genericConstructive);
  } else if (!strengths.length && averageScore >= 5.5) {
    strengths.push(genericPositive);
  } else if (!improvements.length && averageScore <= 7.5) {
    improvements.push(genericConstructive);
  }

  const fill = (text) => fixTheyAgreement(fillPlaceholders(text, name, subject, p), pronoun);
  const filledStrengths = strengths.map(fill);
  const filledImprovements = improvements.map(fill);

  const ctxA = {
    strengths: filledStrengths,
    improvements: filledImprovements,
    pickIntro: () => fill(pick(feedbackFragments.overall_intro[overallLevel]))
  };
  const paragraphAParts = pickVariant(paragraphAVariants, ctxA) || [ctxA.pickIntro(), ...filledStrengths, ...filledImprovements];
  const paragraphA = joinSentences(paragraphAParts, name);

  const lowScoreCats = lowestFirst.filter(cat => scores[cat] <= 5).slice(0, length === "concise" ? 1 : 2);
  const hasSpecificRec = lowScoreCats.length > 0;
  const recommendationText = fill(hasSpecificRec
    ? buildRecommendationClause(lowScoreCats[0], lowScoreCats[1])
    : buildForwardLook(overallLevel));
  const conclusion = fill(pick(feedbackFragments.overall_conclusion[overallLevel]));

  const ctxB = { recommendationText, conclusion, hasSpecificRec };
  const paragraphBParts = pickVariant(paragraphBVariants, ctxB) || [recommendationText, conclusion];
  const paragraphB = joinSentences(paragraphBParts, name);

  let paragraphs;
  if (length === "concise") {
    // Fold everything into a single tight paragraph.
    paragraphs = [joinSentences([paragraphA, recommendationText, conclusion], name)];
  } else if (length === "detailed") {
    // Add a third paragraph that names each dimension explicitly, grouped
    // by strength vs. growth area, for a fuller written report.
    const strengthLine = sortedByScore.filter(c => scores[c] >= 7).slice(0, 3)
      .map(c => `${categoryLabels[c]} (${tierLabel(scores[c])})`).join(", ");
    const growthLine = lowestFirst.filter(c => scores[c] <= 6).slice(0, 3)
      .map(c => `${categoryLabels[c]} (${tierLabel(scores[c])})`).join(", ");
    let summaryParts = [];
    if (strengthLine) summaryParts.push(`Notable strengths this period include ${strengthLine}.`);
    if (growthLine) summaryParts.push(`Areas identified for continued growth include ${growthLine}.`);
    if (!summaryParts.length) summaryParts.push(`${name} shows balanced performance across all observed areas this period.`);
    paragraphs = [paragraphA, paragraphB, summaryParts.join(" ")];
  } else {
    paragraphs = [paragraphA, paragraphB];
  }

  return paragraphs.map(text => text.charAt(0).toUpperCase() + text.slice(1));
}

function setSliderFill(slider) {
  const min = +slider.min || 0;
  const max = +slider.max || 100;
  const pct = ((slider.value - min) / (max - min)) * 100;
  slider.style.setProperty("--fill", `${pct}%`);
}

function updateSliderTag(id) {
  const slider = document.getElementById(id);
  const tag = document.getElementById(`${id}-tag`);
  if (tag) tag.textContent = tierLabel(+slider.value);
}

function updateSliderValue(sliderId, valueId) {
  const slider = document.getElementById(sliderId);
  const valueSpan = document.getElementById(valueId);
  setSliderFill(slider);
  updateSliderTag(sliderId);
  slider.addEventListener("input", () => {
    valueSpan.textContent = slider.value;
    setSliderFill(slider);
    updateSliderTag(sliderId);
    updateFeedback();
  });
}

const sliderIds = ["slider1", "slider2", "slider3", "slider4", "slider5", "slider6", "slider7", "slider8"];

function currentInputs() {
  return {
    name: document.getElementById("name").value.trim(),
    pronoun: document.getElementById("pronoun").value,
    subject: document.getElementById("subject").value.trim(),
    length: document.getElementById("length").value,
    tone: document.getElementById("tone").value,
    sliders: sliderIds.map(id => +document.getElementById(id).value)
  };
}

function renderFeedback(paragraphs) {
  const output = document.getElementById("feedbackOutput");
  output.innerHTML = paragraphs.map(p => `<p>${mdBoldToHtml(p)}</p>`).join("");
  output.classList.remove("hidden");
  document.getElementById("copyBtn").classList.remove("hidden");
  document.getElementById("regenerateBtn").classList.remove("hidden");
  document.getElementById("placeholderHint").classList.add("hidden");
  const wc = paragraphs.join(" ").split(/\s+/).filter(Boolean).length;
  const wcEl = document.getElementById("wordCount");
  wcEl.textContent = `${wc} words`;
  wcEl.classList.remove("hidden");
}

function updateFeedback() {
  const { name, pronoun, subject, sliders, length } = currentInputs();
  if (name && pronoun && subject) {
    renderFeedback(generateFeedback(name, pronoun, subject, sliders, { length }));
  } else {
    document.getElementById("feedbackOutput").classList.add("hidden");
    document.getElementById("copyBtn").classList.add("hidden");
    document.getElementById("regenerateBtn").classList.add("hidden");
    document.getElementById("wordCount").classList.add("hidden");
    document.getElementById("placeholderHint").classList.remove("hidden");
  }
}

document.getElementById("feedbackForm").addEventListener("submit", (e) => {
  e.preventDefault();
  updateFeedback();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  document.getElementById("feedbackForm").reset();
  document.getElementById("feedbackOutput").classList.add("hidden");
  document.getElementById("copyBtn").classList.add("hidden");
  document.getElementById("regenerateBtn").classList.add("hidden");
  document.getElementById("wordCount").classList.add("hidden");
  document.getElementById("placeholderHint").classList.remove("hidden");
  sliderIds.forEach(id => {
    const slider = document.getElementById(id);
    document.getElementById(`${id}-value`).textContent = "6";
    slider.value = "6";
    setSliderFill(slider);
    updateSliderTag(id);
  });
});

document.getElementById("regenerateBtn").addEventListener("click", () => {
  updateFeedback();
});

document.getElementById("copyBtn").addEventListener("click", () => {
  const output = document.getElementById("feedbackOutput");
  const text = Array.from(output.querySelectorAll("p")).map(p => p.textContent).join("\n\n");
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copyBtn");
    const original = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
});
